[package]
name = "dtools"
version = "0.1.0"
authors = ["DCjanus <DCjanus@dcjanus.com>"]
edition = "2024"
rust-version = "1.85"
description = "Small command-line tools for processing text files and streams"
repository = "https://github.com/DCjanus/dtools"
license = "MIT"
readme = "README.md"
keywords = ["cli", "sort", "text", "uniq"]
categories = ["command-line-utilities", "text-processing"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/latest/dtools-{ target }{ archive-suffix }"
bin-dir = "dtools-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[package.metadata.binstall.overrides.'cfg(not(target_os = "windows"))']
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
size = "0.5.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
